<header class="flex items-center justify-between pt-4 font-lobste">
 
  <div class="flex gap-4">
    
  </div>
  
  <div class="flex items-center gap-4">
    <!-- Notifications Dropdown -->
    <div class="relative inline-flex hs-dropdown">
      <button id="notification-dropdown" type="button"
              class="flex items-center justify-center w-8 h-8 bg-gray-100 rounded-full hs-dropdown-toggle hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-800">
        <svg class="w-5 h-5 text-gray-600 dark:text-neutral-200" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
      </button>
      <div
        class="hidden mt-2 bg-white rounded-lg shadow-lg hs-dropdown-menu min-w-60 dark:bg-gray-800 dark:border dark:border-gray-700">
        <div class="z-10 p-4 space-y-3">
          <!-- Titre de la section -->
          <h6 class="text-sm font-semibold text-gray-700 dark:text-neutral-200">
            Notifications
          </h6>
          <p class="text-xs text-gray-500 dark:text-neutral-400">
            No new notifications
          </p>

          <!-- Exemple de notifications -->
          <ul class="space-y-2">
            <li>
              <a href="javascript:void(0);"
                 class="flex items-center gap-3 p-3 transition-all duration-200 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
                <div class="relative">
                  <!-- Icône de notification -->
                  <span
                    class="inline-flex items-center justify-center w-10 h-10 text-blue-500 bg-blue-100 rounded-full">
            <lucide-angular name="bell" class="w-5 h-5"></lucide-angular>
          </span>
                </div>
                <div class="flex-1">
                  <h6 class="text-sm font-medium text-gray-800 dark:text-neutral-200">
                    New Comment
                  </h6>
                  <p class="text-xs text-gray-500 dark:text-neutral-400">
                    You have a new comment on your post.
                  </p>
                </div>
                <span class="text-xs text-gray-400 dark:text-neutral-500">2 min ago</span>
              </a>
            </li>
            <li>
              <a href="javascript:void(0);"
                 class="flex items-center gap-3 p-3 transition-all duration-200 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
                <div class="relative">
                  <!-- Icône de like -->
                  <span
                    class="inline-flex items-center justify-center w-10 h-10 text-green-500 bg-green-100 rounded-full">
            <lucide-angular name="heart" class="w-5 h-5"></lucide-angular>
          </span>
                </div>
                <div class="flex-1">
                  <h6 class="text-sm font-medium text-gray-800 dark:text-neutral-200">
                    New Like
                  </h6>
                  <p class="text-xs text-gray-500 dark:text-neutral-400">
                    Someone liked your photo.
                  </p>
                </div>
                <span class="text-xs text-gray-400 dark:text-neutral-500">10 min ago</span>
              </a>
            </li>
          </ul>

          <!-- Bouton pour voir plus -->
          <div class="pt-2 mt-2 border-t border-gray-200 dark:border-gray-700">
            <a href="javascript:void(0);"
               class="block text-sm font-medium text-center text-blue-600 transition-all duration-200 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
              View All Notifications
            </a>
          </div>
        </div>
      </div>

    </div>

    <!-- User Profile Dropdown -->
    <div class="relative inline-flex hs-dropdown">
      <button id="profile-dropdown" type="button"
              class="w-8 h-8 overflow-hidden rounded-full hs-dropdown-toggle">
        <img src="img/profile.jpg" alt="User" class="object-cover">
      </button>
      <div
        class="hidden mt-2 bg-white rounded-lg shadow-lg hs-dropdown-menu min-w-52 dark:bg-gray-800 dark:border dark:border-gray-700">
        <div class="p-4 space-y-3">
          <!-- Section Titre -->
          <h6 class="text-sm font-medium text-gray-500 dark:text-gray-400">Welcome to Wopecart</h6>

          <!-- User Info -->
          <a href="javascript:void(0);"
             class="flex items-center gap-4 p-2 transition-all duration-200 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <div class="relative">
              <img src="" alt="User"
                   class="w-12 h-12 border border-gray-200 rounded-full dark:border-gray-700"/>
              <span
                class="absolute top-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full dark:border-gray-800"></span>
            </div>
            <div>
              <h6 class="text-sm font-semibold text-gray-800 dark:text-white"></h6>
              <p class="text-xs text-gray-500 dark:text-gray-400">Shop Owner</p>
            </div>
          </a>

          <!-- Menu Items -->
          <ul class="space-y-1">
            <li>
              <a routerLink="/account"
                 class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 transition-all duration-200 rounded-lg hover:bg-gray-100 hover:text-custom-600 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-custom-400">
                <lucide-angular name="user" class="w-5 h-5"></lucide-angular>
                Profile
              </a>
            </li>
            <li>
              <a routerLink="/account/settings"
                 class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 transition-all duration-200 rounded-lg hover:bg-gray-100 hover:text-custom-600 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-custom-400">
                <lucide-angular name="settings" class="w-5 h-5"></lucide-angular>
                Settings
              </a>
            </li>
          </ul>

          <!-- Logout -->
          <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
            <a href="javascript:void(0)"
               class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 transition-all duration-200 rounded-lg hover:bg-gray-100 hover:text-red-600 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-red-400">
              <lucide-angular name="log-out" class="w-5 h-5"></lucide-angular>
              Sign Out
            </a>
          </div>
        </div>
      </div>

    </div>
    
  </div>
  
</header>
